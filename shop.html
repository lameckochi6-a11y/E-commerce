<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce Website</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href=" https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
  </head>
  <body>
    <div class="nav-bar">
      <h2>🛍️FashionHub</h2>
    
      <!-- Hamburger button (only visible on mobile) -->
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>
    
      <!-- Wrap nav links + search inside a collapsible container -->
      <div class="nav-menu" id="navMenu">
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="new-arrival.html">New Arrival</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </div>
        <div class="input-box">
          <input type="text" id="text" placeholder="Text to search.." />
          <button>Search</button>
        </div>
      </div>
    </div>
    <div class="shop-main">
      <h2>Shop All Products</h2>
      <p>Explore our complete collection</p>
    </div>
    <div class="just-tech">
      <div class="images">
        <img src="men1.jpeg" />
        <img src="women1.jpeg" />
        <img src="shoe1.jpeg" />
        <img src="access3.jpeg" />
      </div>
      <div class="see">
        <a href="new-arrival.html"><button>See More</button></a>
      </div>
      <div class="shop-bottom">
        <div class="bott-right">
          <h4>Filters</h4>
          <h5>Category</h5>
          <p><input type="checkbox" />Man</p>
          <p><input type="checkbox" />Woman</p>
          <p><input type="checkbox" />Accessories</p>
          <p><input type="checkbox" />Shoes</p>
          <h6>Price Range</h6>
          <input type="range" min="0" max="100" />
          <p>Ksh. 2500</p>
        </div>
        <div class="bott-left">
          <label>Sort by</label>
          <select>
            <option>Default</option>
            <option>Price: High to Low</option>
            <option>Newest to Oldest</option>
            <option>Oldest to Newest</option>
            <option>Gender: Ladies to men</option>
          </select>
        </div>
      </div>
    </div>
    <script src="menu.js"></script>
  </body>
</html>
